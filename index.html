<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020204" />
    <meta
      name="description"
      content="A glowing 3D birthday wish for Humayra."
    />
    <title>Happy birthday Humayra ✦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="birthday-scene" aria-labelledby="birthday-title">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="scene-haze scene-haze--left" aria-hidden="true"></div>
      <div class="scene-haze scene-haze--right" aria-hidden="true"></div>

      <div class="star-layer" id="star-layer" aria-hidden="true"></div>
      <div class="heart-layer" id="heart-layer" aria-hidden="true"></div>
      <div class="falling-text-layer" id="falling-text-layer" aria-hidden="true"></div>

      <section class="hero-copy">
        <p class="hero-kicker"><span></span> a little universe made for you <span></span></p>
        <h1 id="birthday-title">
          <span class="hero-line hero-line--top">Happy birthday</span>
          <span class="hero-line hero-line--name">Humayra</span>
        </h1>
        <p class="hero-note">May every wish find its way to you.</p>
      </section>

      <p class="scroll-hint" aria-hidden="true">let the wishes fall <span>✦</span></p>
    </main>

    <script src="background.js"></script>
    <script src="text-engine.js"></script>
    <script src="script.js"></script>
  </body>
</html>
